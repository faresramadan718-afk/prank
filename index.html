<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إشعارات المزاح</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f0f4f8; }
  button { font-size: 18px; padding: 10px 25px; margin: 8px; border: none; border-radius: 8px; cursor: pointer; }
  #startBtn { background: #4caf50; color: white; }
  #stopBtn { background: #e53935; color: white; }
  #testBtn { background: #2196f3; color: white; }
  #status { font-size: 16px; margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<h1>إشعارات نظام المزاح 😄</h1>
<p>دوسي على "بدء" ووافقي على الإشعارات.</p>

<button id="startBtn">بدء ▶</button>
<button id="stopBtn">إيقاف ■</button>
<button id="testBtn">إشعار تجريبي 🔔</button>

<p id="status" style="color: red;">متوقف</p>

<script>
  let timer = null;
  let running = false;
  const messages = ["أنت غبي 😄", "أنت غبي 😜", "أنت غبي 🤪"];
  const status = document.getElementById("status");

  function showNotification() {
    if (Notification.permission !== "granted") return;
    
    const msg = messages[Math.floor(Math.random() * messages.length)];
    
    // طريقة حديثة بتشتغل على أندرويد وكمبيوتر
    navigator.serviceWorker.register('sw.js').then(function(registration) {
      registration.showNotification("رسالة مزاح", {
        body: msg,
        icon: "https://cdn-icons-png.flaticon.com/512/179/179386.png",
        vibrate: [200, 100, 200]
      });
    }).catch(function(err) {
      // لو الـ Service Worker مش شغال، نستخدم الطريقة العادية
      new Notification("رسالة مزاح", { body: msg });
    });
  }

  function requestPermission() {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        status.textContent = "تم السماح بالإشعارات ✅";
        status.style.color = "green";
      } else {
        status.textContent = "تم رفض الإذن ❌";
        status.style.color = "red";
      }
    });
  }

  function start() {
    if (running) return;
    if (Notification.permission !== "granted") {
      requestPermission();
      return;
    }
    running = true;
    status.textContent = "شغال... (اضغطي إيقاف)";
    status.style.color = "green";
    showNotification();
    timer = setInterval(showNotification, 5000);
  }

  function stop() {
    running = false;
    clearInterval(timer);
    status.textContent = "متوقف";
    status.style.color = "red";
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("stopBtn").addEventListener("click", stop);
  document.getElementById("testBtn").addEventListener("click", function() {
    if (Notification.permission === "granted") {
      showNotification();
    } else {
      requestPermission();
    }
  });
</script>

</body>
</html>
